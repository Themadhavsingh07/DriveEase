name: DriveEase CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-verify:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile & Build Frontend Bundle
        run: npm run build

  backend-verify:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: driveease_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Compile Backend TypeScript
        run: npm run build

      - name: Run Database Migrations / Schema Push
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/driveease_test

      - name: Seed Database Records for Tests
        run: npm run prisma:seed
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/driveease_test

      - name: Execute Vitest Test Suites
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/driveease_test
          JWT_ACCESS_SECRET: test_access_secret_32chars_long_ci
          JWT_REFRESH_SECRET: test_refresh_secret_32chars_long_ci
          COOKIE_SECRET: test_cookie_secret_32chars_long_ci
          RAZORPAY_KEY_ID: rzp_test_DriveEaseTestKey123
          RAZORPAY_KEY_SECRET: dummy_rzp_secret
          RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_driveease_2026
