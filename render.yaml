# ==============================================================================
# DriveEase Render Blueprint Deployment Specification
# ==============================================================================
services:
  # DriveEase Node.js REST API Backend
  - type: web
    name: driveease-api
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: driveease-db
          property: connectionString
      - key: CLIENT_URL
        value: https://driveease.vercel.app
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: BOOKING_HOLD_MINUTES
        value: 10
      - key: TAX_RATE
        value: 0.18
      - key: CANCELLATION_FREE_WINDOW_HOURS
        value: 24
      - key: CANCELLATION_LATE_FEE_PERCENTAGE
        value: 20
      # Secrets to be configured via Render Dashboard / Environment Variables:
      # - JWT_ACCESS_SECRET
      # - JWT_REFRESH_SECRET
      # - COOKIE_SECRET
      # - RAZORPAY_KEY_ID
      # - RAZORPAY_KEY_SECRET
      # - RAZORPAY_WEBHOOK_SECRET

databases:
  # Managed PostgreSQL Database
  - name: driveease-db
    databaseName: driveease
    user: driveease_user
    region: oregon
    plan: starter
